name: Build installers

# Builds Windows, macOS and Linux installers on every push.
# Pushing a tag like v0.2.0 (or running this workflow by hand with "publish" ticked)
# also creates a GitHub Release with the installers attached, for easy downloading.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with these installers'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOrg-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - id: version
        run: echo "tag=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LifeOrg ${{ steps.version.outputs.tag }}
          files: installers/*
          body: |
            ## Download LifeOrg

            | Your computer | Download this file |
            | --- | --- |
            | **Windows** | `LifeOrg-…-win-x64.exe` |
            | **Mac (Apple M1/M2/M3/M4)** | `LifeOrg-…-mac-arm64.dmg` |
            | **Mac (older Intel)** | `LifeOrg-…-mac-x64.dmg` |
            | **Linux** | `.AppImage` (any distro) or `.deb` (Ubuntu/Debian) |

            Step-by-step install help: see the [README](https://github.com/${{ github.repository }}#install).
